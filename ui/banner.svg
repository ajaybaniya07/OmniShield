<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;display=swap');
      .banner-title {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        letter-spacing: 16px;
        fill: #ffffff;
      }
      .banner-sub {
        font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        letter-spacing: 10px;
        fill: #00e5ff;
      }
      .banner-tag {
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 500;
        letter-spacing: 2px;
        fill: #94a3b8;
      }
    </style>

    <radialGradient id="bannerBg" cx="35%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141c2b"/>
      <stop offset="60%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="60%" stop-color="#00d8f6"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>

    <filter id="vectorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bannerBg)"/>

  <!-- Glowing Aura behind Shield -->
  <circle cx="340" cy="315" r="180" fill="#00e5ff" opacity="0.15" filter="url(#softAura)"/>

  <!-- SHIELD EMBLEM (Scale and centered on left side) -->
  <g transform="translate(100, 45) scale(0.68)">
    <!-- Outer Shield Frame -->
    <path d="M500,100 L695,185 L695,390 C695,535 605,630 500,685 C395,630 305,535 305,390 L305,185 Z" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="24" 
          stroke-linejoin="round" 
          stroke-linecap="round"
          filter="url(#vectorGlow)"/>

    <!-- Inner Circuit Tracks -->
    <path d="M450,170 L360,210 L360,365 L410,415" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="18" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
    
    <path d="M500,170 L545,190" stroke="url(#neonCyan)" stroke-width="18" stroke-linecap="round"/>
    
    <path d="M640,320 L640,390 C640,475 580,550 500,605" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="16" 
          stroke-linejoin="round" 
          stroke-linecap="round" 
          opacity="0.85"/>
          
    <path d="M385,510 C435,565 470,590 500,610 C530,590 565,565 615,510" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="18" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <circle cx="630" cy="430" r="10" fill="#00ffff" filter="url(#vectorGlow)"/>

    <!-- Center O Logomark -->
    <circle cx="500" cy="385" r="95" 
            fill="none" 
            stroke="url(#neonCyan)" 
            stroke-width="34" 
            stroke-linecap="round"
            filter="url(#vectorGlow)"/>
    <circle cx="500" cy="385" r="60" fill="#0b1019"/>

    <!-- Arrow Breakout ↗ -->
    <line x1="455" y1="430" x2="620" y2="265" 
          stroke="url(#neonCyan)" 
          stroke-width="28" 
          stroke-linecap="round"
          filter="url(#vectorGlow)"/>
    <path d="M555,245 L665,220 L640,330 L600,290 Z" 
          fill="url(#neonCyan)" 
          stroke="url(#neonCyan)" 
          stroke-width="4" 
          stroke-linejoin="round"
          filter="url(#vectorGlow)"/>
  </g>

  <!-- TEXT BLOCK (Right Side) -->
  <g transform="translate(620, 270)">
    <text x="0" y="0" class="banner-title" font-size="64">OMNISHIELD</text>
    <text x="0" y="48" class="banner-sub" font-size="22">
      <tspan fill="#00e5ff">•</tspan> EDR CYBERSECURITY <tspan fill="#00e5ff">•</tspan>
    </text>
    <text x="0" y="110" class="banner-tag" font-size="18">Unified Native Windows Endpoint Defense</text>
    <text x="0" y="136" class="banner-tag" font-size="15" fill="#64748b">Sysmon · Sigma · YARA · ClamAV · osquery · Defender ASR</text>
  </g>
</svg>
