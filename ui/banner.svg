<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A6E"/>
      <stop offset="50%" stop-color="#1E56A0"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bInnerGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1E3A6E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Shield Mark (Left) -->
  <g transform="translate(240, 290) scale(0.55)">
    <!-- Outer Shield -->
    <path d="M 0,-260 
             L 260,-140 
             L 260,80 
             C 260,250 140,350 0,390 
             C -140,350 -260,250 -260,80 
             L -260,-140 Z" 
          fill="none" stroke="url(#bShieldGrad)" stroke-width="32" stroke-linejoin="round"/>

    <!-- Inner Shield -->
    <path d="M 0,-155 
             L 170,-78 
             L 170,55 
             C 170,155 85,215 0,240 
             C -85,215 -170,155 -170,55 
             L -170,-78 Z" 
          fill="none" stroke="url(#bInnerGrad)" stroke-width="24" stroke-linejoin="round"/>

    <!-- Letter O -->
    <ellipse cx="0" cy="40" rx="80" ry="105" 
             fill="none" stroke="url(#bShieldGrad)" stroke-width="26"/>

    <!-- Connecting Lines -->
    <line x1="0" y1="-260" x2="0" y2="-155" stroke="url(#bShieldGrad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="0" y1="240" x2="0" y2="390" stroke="url(#bInnerGrad)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Branding (Right) -->
  <text x="490" y="258"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="800"
        font-size="62"
        letter-spacing="10"
        fill="#0f172a">OMNISHIELD</text>

  <text x="493" y="315"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="600"
        font-size="20"
        letter-spacing="6"
        fill="#06B6D4">ENDPOINT DEFENSE</text>

  <text x="493" y="368"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="400"
        font-size="16"
        letter-spacing="1"
        fill="#64748b">Premium Cybersecurity • Threat Detection • AI Telemetry</text>

  <!-- Accent Rule -->
  <rect x="493" y="398" width="380" height="3" rx="2" fill="#06B6D4"/>
</svg>
