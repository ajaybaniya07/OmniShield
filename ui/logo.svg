<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container (optional background layer) -->
  <rect width="1000" height="1000" rx="220" fill="#0b1120"/>

  <!-- Outer Shield Outline (Vertically Centered at Y=500) -->
  <path d="M 500,170 
           L 790,290 
           L 790,520 
           C 790,690 660,795 500,840 
           C 340,795 210,690 210,520 
           L 210,290 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="38" 
        stroke-linejoin="round"
        stroke-linecap="round"/>

  <!-- Inner Shield Accent -->
  <path d="M 500,270 
           L 705,355 
           L 705,510 
           C 705,635 605,715 500,750 
           C 395,715 295,635 295,510 
           L 295,355 Z" 
        fill="none" 
        stroke="url(#glowGrad)" 
        stroke-width="24" 
        stroke-linejoin="round"
        stroke-linecap="round"
        opacity="0.85"/>

  <!-- Center 'O' Monogram (Vertically Centered at Y=500) -->
  <ellipse cx="500" cy="505" rx="105" ry="135" 
           fill="none" 
           stroke="url(#shieldGrad)" 
           stroke-width="36"/>

  <!-- Center Glow Accent Ring -->
  <ellipse cx="500" cy="505" rx="68" ry="96" 
           fill="none" 
           stroke="url(#glowGrad)" 
           stroke-width="14"
           opacity="0.9"/>

  <!-- Geometric Connecting Structural Struts -->
  <line x1="500" y1="170" x2="500" y2="370" stroke="url(#shieldGrad)" stroke-width="22" stroke-linecap="round"/>
  <line x1="500" y1="640" x2="500" y2="840" stroke="url(#shieldGrad)" stroke-width="22" stroke-linecap="round"/>
</svg>
