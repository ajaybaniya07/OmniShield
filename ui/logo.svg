<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A6E"/>
      <stop offset="50%" stop-color="#1E56A0"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#1E3A6E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" rx="120" fill="#0e1423"/>

  <!-- Outer Shield -->
  <path d="M 500,100 
           L 760,220 
           L 760,440 
           C 760,610 640,710 500,750 
           C 360,710 240,610 240,440 
           L 240,220 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="36" stroke-linejoin="round"/>

  <!-- Inner Shield -->
  <path d="M 500,210 
           L 670,295 
           L 670,430 
           C 670,555 585,630 500,660 
           C 415,630 330,555 330,430 
           L 330,295 Z" 
        fill="none" stroke="url(#innerGrad)" stroke-width="28" stroke-linejoin="round"/>

  <!-- Letter O (Elegant Flowing) -->
  <ellipse cx="500" cy="420" rx="95" ry="120" 
           fill="none" stroke="url(#shieldGrad)" stroke-width="30"/>

  <!-- Connecting Lines (Shield to O) -->
  <line x1="500" y1="100" x2="500" y2="210" stroke="url(#shieldGrad)" stroke-width="18" stroke-linecap="round"/>
  <line x1="500" y1="660" x2="500" y2="750" stroke="url(#innerGrad)" stroke-width="18" stroke-linecap="round"/>

  <!-- Typography -->
  <text x="500" y="855"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="800"
        font-size="60"
        letter-spacing="10"
        fill="#ffffff">OMNISHIELD</text>

  <text x="500" y="910"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-weight="600"
        font-size="20"
        letter-spacing="8"
        fill="#06B6D4">ENDPOINT DEFENSE</text>
</svg>
